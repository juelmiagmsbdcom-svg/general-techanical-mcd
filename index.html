<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Inventory Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin: 5px 0;
        }

        .menu {
            margin-top: 25px;
            display: grid;
            gap: 12px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <h1>Factory Inventory Tracker</h1>
    <p>Serviceable • Repairable • Unserviceable</p>
</header>

<div class="container">

    <div class="dashboard">

        <div class="card">
            <p>Total Items</p>
            <h2>0</h2>
        </div>

        <div class="card">
            <p>Current Stock</p>
            <h2>0</h2>
        </div>

        <div class="card">
            <p>Total Receive</p>
            <h2>0</h2>
        </div>

        <div class="card">
            <p>Total Issue</p>
            <h2>0</h2>
        </div>

    </div>

    <div class="menu">

        <button>📦 Item Master</button>

        <button>➕ Receive</button>

        <button>➖ Issue</button>

        <button>🔧 Serviceable</button>

        <button>🛠 Repairable</button>

        <button>❌ Unserviceable</button>

        <button>📊 Monthly Summary</button>

    </div>

</div>

</body>
</html>
